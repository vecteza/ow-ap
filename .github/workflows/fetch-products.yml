name: Fetch product images
on:
  schedule:
    - cron: "0 7 * * 6"   # Saturdays 12:00 PKT, before the 2:34 PM posting task
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-products.yml", "scripts/fetch_products.py", "kit/refresh.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_products.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kit/products
          git diff --cached --quiet || (git commit -m "Update product images" && git push)
